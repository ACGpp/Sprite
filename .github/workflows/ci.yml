name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install -g @mariozechner/pi-coding-agent@0.70.2
      - name: Toolchain versions
        run: |
          node --version
          swift --version
          pi --version
      - name: Type checks
        run: |
          npm run core:typecheck
          npm run policy:typecheck
          npm run pi:typecheck
          npm run typecheck
      - run: npm run core:test
      - run: npm run release:test
      - run: npm run shell:test
